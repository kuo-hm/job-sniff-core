syntax = "proto3";

package user;

service UserService {
  
  rpc Login (LoginRequest) returns (Response);
  rpc Register (RegisterRequest) returns (Response);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message Response {
  string username = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
}

message RegisterRequest {
  string username = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string password = 5;
}